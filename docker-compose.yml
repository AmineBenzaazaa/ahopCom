version: '3.8'
services:
  mongo:
    image: mongo:6.0
    container_name: prolink-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${DB}
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - '27018:27017'
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: